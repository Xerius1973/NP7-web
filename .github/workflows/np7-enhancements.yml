name: NP7 enhancements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Inject NP7 V16') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject enhancement script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./np7-enhancements.js"></script>'
          if tag not in s:
              marker='</head>'
              if marker not in s:
                  raise SystemExit('No </head> marker found')
              s=s.replace(marker, tag+marker, 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Inject NP7 V16 enhancements'
          git push
