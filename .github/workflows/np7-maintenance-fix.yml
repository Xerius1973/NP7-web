name: NP7 maintenance fix

on:
  push:
    paths:
      - '.github/workflows/np7-maintenance-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Clean conflicting water patches
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for sid in ['np7-final-water-food-fix','np7-water-button-hard-fix','np7-water-final-controller','np7-water-final-style']:
              s=re.sub(r'<script[^>]*id=["\']'+re.escape(sid)+r'["\'][^>]*>[\s\S]*?</script>\s*','',s,flags=re.I)
              s=re.sub(r'<style[^>]*id=["\']'+re.escape(sid)+r'["\'][^>]*>[\s\S]*?</style>\s*','',s,flags=re.I)
          patch=r'''<style id="np7-water-final-style">
          .np7-water-portions{margin-top:12px;display:grid;gap:7px}.np7-water-portions-title{font-size:12px;font-weight:800;color:#a8b8d0}.np7-water-portion{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid #203653;border-radius:12px;background:#0b1b30;color:#edf4ff;font-size:13px}.np7-water-remove{background:#2a1c2a;color:#ffb4b4;border:1px solid #59303a;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer}
          </style>
          <script id="np7-water-final-controller">
          (function(){
            'use strict';
            const KEY='np7_water_tracker_v1';
            const day=()=>new Date().toLocaleDateString('sv-SE');
            const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}};
            const write=x=>localStorage.setItem(KEY,JSON.stringify(x));
            function get(){const x=read(),d=day();x[d]=x[d]||{taken:0,goal:2500,history:[]};x[d].taken=Number(x[d].taken)||0;x[d].goal=Number(x[d].goal)||2500;x[d].history=Array.isArray(x[d].history)?x[d].history:[];return [x,d,x[d]]}
            function render(){
              const [x,d,e]=get(),taken=e.taken,goal=e.goal,pct=Math.min(100,Math.round(taken/goal*100));
              const set=(id,v)=>{const n=document.getElementById(id);if(n)n.textContent=v};
              set('np7WaterTaken',taken+' ml');set('np7WaterGoal',goal+' ml');set('np7WaterPercent',pct+' %');set('np7BottlePercent',pct+' %');set('np7BottleLitres',(taken/1000).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' L');
              const bar=document.getElementById('np7WaterBar');if(bar)bar.style.width=pct+'%';
              const liquid=document.getElementById('np7BottleLiquid');if(liquid){const h=210*pct/100;liquid.setAttribute('y',String(248-h));liquid.setAttribute('height',String(h))}
              const list=document.getElementById('np7WaterPortions');if(list)list.innerHTML=e.history.length?'<div class="np7-water-portions-title">Portions d’aujourd’hui</div>'+e.history.map((ml,i)=>'<div class="np7-water-portion"><span>💧 '+ml+' ml</span><button type="button" class="np7-water-remove" data-water-remove="'+i+'">Supprimer</button></div>').join(''):'<div class="np7-water-portions-title">Aucune portion enregistrée aujourd’hui.</div>';
            }
            window.np7AddWaterFixed250=function(){const [x,d,e]=get();e.history.push(250);e.taken+=250;write(x);render();const b=document.querySelector('.np7Bottle');if(b){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}};
            window.np7RemoveWaterPortion=function(i){const [x,d,e]=get();if(i<0||i>=e.history.length)return;e.taken=Math.max(0,e.taken-(Number(e.history.splice(i,1)[0])||0));write(x);render()};
            document.addEventListener('click',function(ev){const r=ev.target.closest&&ev.target.closest('[data-water-remove]');if(r){ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();window.np7RemoveWaterPortion(Number(r.dataset.waterRemove));return}const a=ev.target.closest&&ev.target.closest('.np7-water-add');if(a){ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();window.np7AddWaterFixed250();return}},true);
            function init(){const a=document.querySelector('.np7-water-add');if(a){a.type='button';a.removeAttribute('onclick')}render()}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
          })();
          </script>
          '''
          s=s.replace('</body></html>',patch+'\n</body></html>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'NP7 Maintenance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix définitivement le bouton eau'
          git push
