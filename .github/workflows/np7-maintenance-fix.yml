name: NP7 maintenance fix

on:
  push:
    paths:
      - '.github/workflows/np7-maintenance-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Clean conflicting water patches
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for sid in ['np7-final-water-food-fix','np7-water-button-hard-fix','np7-water-final-controller','np7-water-final-style']:
              s=re.sub(r'<script[^>]*id=["\']'+re.escape(sid)+r'["\'][^>]*>[\s\S]*?</script>\s*','',s,flags=re.I)
              s=re.sub(r'<style[^>]*id=["\']'+re.escape(sid)+r'["\'][^>]*>[\s\S]*?</style>\s*','',s,flags=re.I)
          patch=r'''<style id="np7-water-final-style">
          .np7-water-portions,.np7-water-history,#np7WaterHistory{display:none!important}
          .np7-water-controls{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px}
          .np7-water-controls button{min-width:112px;border-radius:12px;padding:10px 13px;font-weight:850;cursor:pointer}
          .np7-water-minus{background:#1a2638;color:#edf4ff;border:1px solid #29415f}
          .np7-water-add{background:linear-gradient(135deg,#a874ff,#8d5de8)!important;color:#fff!important}
          </style>
          <script id="np7-water-final-controller">
          (function(){
            'use strict';
            const KEY='np7_water_tracker_v1';
            const day=()=>new Date().toLocaleDateString('sv-SE');
            const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}};
            const write=x=>localStorage.setItem(KEY,JSON.stringify(x));
            function get(){const x=read(),d=day();x[d]=x[d]||{taken:0,goal:2500,history:[]};x[d].taken=Math.max(0,Number(x[d].taken)||0);x[d].goal=Number(x[d].goal)||2500;x[d].history=Array.isArray(x[d].history)?x[d].history:[];return [x,d,x[d]]}
            function render(){
              const [x,d,e]=get(),taken=e.taken,goal=e.goal,pct=Math.min(100,Math.round(taken/goal*100));
              const set=(id,v)=>{const n=document.getElementById(id);if(n)n.textContent=v};
              set('np7WaterGoal',goal+' ml');set('np7WaterTaken',taken+' ml');set('np7WaterPercent',pct+' %');set('np7BottlePercent',pct+' %');set('np7BottleLitres',(taken/1000).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' L');
              const bar=document.getElementById('np7WaterBar');if(bar)bar.style.width=pct+'%';
              const liquid=document.getElementById('np7BottleLiquid');if(liquid){const h=210*pct/100;liquid.setAttribute('y',String(248-h));liquid.setAttribute('height',String(h))}
              const old=document.getElementById('np7WaterPortions');if(old)old.style.display='none';
              const hist=document.getElementById('np7WaterHistory');if(hist)hist.style.display='none';
              const card=document.querySelector('.np7-home-water');
              if(card){
                let controls=card.querySelector('.np7-water-controls');
                if(!controls){controls=document.createElement('div');controls.className='np7-water-controls';const add=card.querySelector('.np7-water-add');if(add){add.type='button';add.removeAttribute('onclick');add.textContent='+ 250 ml';controls.appendChild(add)}else{const b=document.createElement('button');b.type='button';b.className='np7-water-add';b.textContent='+ 250 ml';controls.appendChild(b)}const minus=document.createElement('button');minus.type='button';minus.className='np7-water-minus';minus.textContent='− 250 ml';controls.appendChild(minus);card.appendChild(controls);}
                const add=controls.querySelector('.np7-water-add'),minus=controls.querySelector('.np7-water-minus');
                if(add)add.onclick=(ev)=>{ev.preventDefault();ev.stopPropagation();add250()};
                if(minus)minus.onclick=(ev)=>{ev.preventDefault();ev.stopPropagation();remove250()};
              }
            }
            function add250(){const [x,d,e]=get();e.history.push(250);e.taken+=250;write(x);render();animate()}
            function remove250(){const [x,d,e]=get();if(e.taken<250)return;e.taken=Math.max(0,e.taken-250);if(e.history.length){const i=e.history.length-1;e.history.splice(i,1)}write(x);render();animate()}
            function animate(){const b=document.querySelector('.np7Bottle');if(b){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}}
            window.np7AddWaterFixed250=add250;
            window.np7RemoveWater250=remove250;
            function init(){render()}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
          })();
          </script>
          '''
          s=s.replace('</body></html>',patch+'\n</body></html>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'NP7 Maintenance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Simplifier le suivi de l eau avec plus et moins 250 ml'
          git push
