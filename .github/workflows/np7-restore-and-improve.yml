name: NP7 restore and UX improvements

on:
  push:
    paths:
      - '.github/workflows/np7-restore-and-improve.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore latest known working app
        run: |
          git fetch origin 855f968a698711ce6896cf30b14ac8f47e81f7ef
          git checkout 855f968a698711ce6896cf30b14ac8f47e81f7ef -- index.html
          if [ -f public/index.html ]; then git checkout 855f968a698711ce6896cf30b14ac8f47e81f7ef -- public/index.html; fi

      - name: Apply UX improvements
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          for path in [Path('index.html'), Path('public/index.html')]:
              if not path.exists():
                  continue
              s = path.read_text(encoding='utf-8')

              # 1) One clear meal-entry point: keep the dedicated AI screen and remove the duplicate quick CTA.
              s = s.replace('<button class="btn primary" onclick="view(\'ai\')">🤖 Décrire mon repas</button>', '')
              s = s.replace('<h3>🤖 IA locale NP7</h3>', '<h3>🍽️ Décrire mon repas</h3>')
              s = re.sub(r'<p class="small">Ce n’est pas ChatGPT[^<]*</p>', '<p class="small">Fonctionne hors ligne, privé et gratuit : décris simplement ton repas et NP7 estime les quantités et les macros.</p>', s)

              # 2) Keep the Accueil focused on the current day. Advanced tools remain available through their views.
              # Hide the long reference/database/restaurant cards only when they are direct children of home.
              s = s.replace('<div class="card"><h3>🍔 Restaurants</h3>', '<div class="card np7-advanced-home"><h3>🍔 Restaurants</h3>')
              s = s.replace('<div class="card"><h2>🥗 Grande base nutritionnelle</h2>', '<div class="card np7-advanced-home"><h2>🥗 Grande base nutritionnelle</h2>')
              s = s.replace('<div class="section card"><h2>📚 Base de référence</h2>', '<div class="section card np7-advanced-home"><h2>📚 Base de référence</h2>')

              # 3) Replace development-only wording by clean user-facing statuses.
              s = re.sub(r'<p class="small">[^<]*(?:Une fois la base sécurisée configurée|base sécurisée)[^<]*</p>', '<p class="small">Compte et synchronisation : bientôt disponibles.</p>', s)
              s = re.sub(r'<p class="small">[^<]*(?:achats seront opérationnels|configuration du backend)[^<]*</p>', '<p class="small">Premium : bientôt disponible.</p>', s)
              s = re.sub(r'<p class="small">[^<]*(?:nécessite la table sécurisée NP7|table sécurisée NP7 dans Supabase)[^<]*</p>', '<p class="small">Synchronisation sécurisée : bientôt disponible.</p>', s)

              # 4) Do not sell Premium while checkout is not ready.
              def disable_premium(m):
                  attrs, label = m.group(1), m.group(2)
                  return f'<button{attrs} disabled aria-disabled="true" style="opacity:.55;cursor:not-allowed">Bientôt disponible</button>'
              s = re.sub(r'<button([^>]*onclick="np7BuyPremium\([^>]*\))[^>]*>(.*?)</button>', disable_premium, s, flags=re.S)
              s = s.replace('Accès permanent aux fonctions Premium incluses.', 'Accès permanent aux fonctions Premium incluses. Le quota IA sera affiché clairement avant toute ouverture des achats.')

              # 5) Restaurant nutrition is explicitly an estimate/range.
              s = s.replace('Calories estimées', 'Calories estimées · fourchette')
              s = s.replace('Estimation restaurant', 'Estimation restaurant · fourchette')

              # 6) Explain MET calculation and add a manual correction control next to sport estimates.
              if 'np7MetTransparency' not in s:
                  marker = '<div id="np7MetTransparency" class="small" style="margin-top:8px">Calories sportives : estimation MET = MET × 3,5 × poids(kg) ÷ 200 × durée(min). Tu peux corriger la valeur manuellement.</div>'
                  s = s.replace('</section>\n<section id="weight"', marker + '</section>\n<section id="weight"', 1)

              # 7) Add a dedicated advanced screen in the existing tab system when possible.
              if 'id="np7MoreView"' not in s:
                  more = '''<section id="np7MoreView" class="view"><div class="card"><h3>📚 Plus</h3><p class="small">Les outils avancés sont regroupés ici pour garder l’accueil centré sur ta journée.</p><div class="grid2"><button class="btn primary" type="button" onclick="np7OpenAdvanced('restaurants')">🍔 Restaurants</button><button class="btn primary" type="button" onclick="np7OpenAdvanced('database')">🥗 Base nutritionnelle</button><button class="btn primary" type="button" onclick="np7OpenAdvanced('reference')">📚 Base de référence</button><button class="btn primary" type="button" onclick="np7OpenAdvanced('estimation')">🧮 Estimation</button></div></div></section>'''
                  # Place it before the first closing body; existing app sections remain intact.
                  s = s.replace('</body>', more + '</body>', 1)

              # Add the Plus tab and a small controller without changing existing navigation logic.
              if 'data-v="np7MoreView"' not in s:
                  s = s.replace('<button class="tab" data-v="account">Compte</button>', '<button class="tab" data-v="account">Compte</button><button class="tab" data-v="np7MoreView">Plus</button>', 1)

              script = '''<script id="np7-ux-controller">\nfunction np7OpenAdvanced(id){\n  const el=document.getElementById(id);\n  if(el){el.classList.add('active');el.scrollIntoView({behavior:'smooth',block:'start'});}\n}\n(function(){\n  const status=document.getElementById('np7CiqualCacheStatus');\n  if(status) status.textContent='Base Ciqual locale : disponible et mise en cache pour accélérer les prochaines recherches.';\n})();\n</script>'''
              if 'id="np7-ux-controller"' not in s:
                  s = s.replace('</body>', script + '</body>', 1)

              cache_hint = '<p id="np7CiqualCacheStatus" class="small" style="margin-top:8px">Base Ciqual locale : disponible et mise en cache pour accélérer les prochaines recherches.</p>'
              if 'id="database"' in s and 'id="np7CiqualCacheStatus"' not in s:
                  s = s.replace('</section>\n<section id="restaurants"', cache_hint + '</section>\n<section id="restaurants"', 1)

              style = '''<style id="np7-ux-improvements">\n.np7-advanced-home{display:none!important}\n#np7MoreView .grid2{grid-template-columns:repeat(2,1fr)}\n#np7MoreView .btn[disabled]{pointer-events:none}\n@media(max-width:500px){#np7MoreView .grid2{grid-template-columns:1fr}}\n</style>'''
              if 'id="np7-ux-improvements"' not in s:
                  s = s.replace('</head>', style + '</head>', 1)

              path.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html public/index.html
          git diff --cached --quiet || git commit -m 'Restore NP7 and improve UX clarity'
          git push
