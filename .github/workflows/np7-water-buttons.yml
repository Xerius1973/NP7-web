name: NP7 UI fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-water-buttons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix hydration controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="np7-water-buttons-fix">
          .np7-water-controls{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:8px!important;width:min(100%,420px)!important;max-width:420px!important;margin:10px auto 0!important;box-sizing:border-box!important;overflow:hidden!important}
          .np7-water-controls .np7-water-minus,.np7-water-controls .np7-water-add{display:flex!important;align-items:center!important;justify-content:center!important;flex:unset!important;width:100%!important;min-width:0!important;max-width:none!important;height:48px!important;padding:8px 4px!important;margin:0!important;border-radius:12px!important;font-size:14px!important;font-weight:900!important;line-height:1!important;white-space:nowrap!important;box-sizing:border-box!important}
          .np7-water-controls .np7-water-minus{order:1!important;background:#10223a!important;color:#edf4ff!important;border:1px solid #29415f!important}
          .np7-water-controls .np7-water-add{order:2!important;background:#a66cff!important;color:#fff!important}
          @media(max-width:500px){.np7-water-controls{width:100%!important;max-width:320px!important;gap:6px!important}.np7-water-controls .np7-water-minus,.np7-water-controls .np7-water-add{height:44px!important;padding:7px 3px!important;font-size:12px!important}}
          </style>
          '''
          pattern=r'<style id="np7-water-buttons-fix">.*?</style>'
          if re.search(pattern,s,re.S):
              s=re.sub(pattern,css.strip(),s,count=1,flags=re.S)
          else:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Make hydration buttons equal size on mobile'
          git push
